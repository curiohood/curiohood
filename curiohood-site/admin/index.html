<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CurioHood 内容后台</title>
<style>
  body {
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, sans-serif;
    background: #FAF7F2;
    color: #1E1C18;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .fallback { max-width: 520px; padding: 40px 28px; text-align: center; }
  .fallback h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
  .fallback p { font-size: 14px; line-height: 1.8; color: #847B6D; margin: 0 0 8px; }
</style>
</head>
<body>
<div class="fallback" id="fallback">
  <h1>后台加载中</h1>
  <p>首次打开可能需要十几秒，请稍候。</p>
  <p>如果超过一分钟仍停留在此页，请按 Cmd+Shift+R 强制刷新，或检查网络。</p>
</div>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
<script>
  (function () {
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (window.CMS || window.Sveltia) {
        var f = document.getElementById("fallback");
        if (f) { f.style.display = "none"; }
        clearInterval(timer);
      } else if (tries > 50) {
        clearInterval(timer);
      }
    }, 300);
  })();
</script>
</body>
</html>
